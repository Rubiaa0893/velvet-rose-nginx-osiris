<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Velvet Rose Server | Osiris Alvarado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            background: linear-gradient(
                135deg,
                #260916,
                #591c39,
                #8b4564
            );
            color: #fff5f8;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 750px;
            text-align: center;
            padding: 65px 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #d7a86e;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .rosa {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            color: #f4d3a4;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitulo {
            font-size: 17px;
            letter-spacing: 3px;
            color: #f5bfd0;
        }

        .mensaje {
            font-size: 25px;
            line-height: 1.5;
            margin: 35px 0;
        }

        .estado {
            display: inline-block;
            background: #f4d3a4;
            color: #45142c;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        footer {
            margin-top: 45px;
            font-size: 14px;
            color: #f5bfd0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            .mensaje {
                font-size: 20px;
            }

            .contenedor {
                padding: 45px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="rosa">🌹</div>

        <p class="subtitulo">
            MI PRIMER SERVIDOR EN LA NUBE
        </p>

        <h1>Velvet Rose Server</h1>

        <p class="mensaje">
            Hola Chic@s, mi servidor Velvet Rose
            está funcionando
        </p>

        <div class="estado">
            Servidor web en línea
        </div>

        <footer>
            Actividad Formativa 2
            <br><br>
            Osiris Rubí Alvarado Arias
            <br>
            Matrícula: 85957
            <br><br>
            Programación Web | 2026
        </footer>

    </main>

</body>
</html>
